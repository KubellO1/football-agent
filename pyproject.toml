[project]
name = "football-agent"
version = "0.1.0"
description = "Production-grade football betting intelligence platform."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # --- Web / API ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # --- Config / validation ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # --- Cache / messaging ---
    "redis>=5.0",
    # --- External I/O ---
    "httpx>=0.27",
    # --- Windows IANA timezone database ---
    "tzdata>=2026.3,<2027; sys_platform == 'win32'",
    # --- Spreadsheet import (dev/ops tooling) ---
    "openpyxl>=3.1",
    # --- AI reasoning ---
    "openai>=2.45,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — linting + import sorting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "TCH", # type-checking imports
]
ignore = ["E501"]  # line length handled by Black

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Black — formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------------------------------------------------------------------------
# MyPy — static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: tests that touch external infra (db/redis/http)",
]
